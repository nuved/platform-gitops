# nuved.io's site on the shared Hetzner box, since the AWS cluster went (2026-10-06).
#
# Lives at /srv/nuved/website (the nuved-data volume), put there by deploy.sh from one commit of this
# repo. Every path below is relative to that directory:
#
#   P/site/html     configmap.yaml's keys: the pages, robots.txt, the fonts (unpack.py)
#   P/site/brand    brand.yaml's keys, served at /brand/
#   P/site/conf.d   nginx.conf.yaml's default.conf, the whole server block
#   P/REVISION      the commit those came from
#
# Nothing is published on a host port. The box's nginx (sprachbrucke-nginx) reaches
# nuved-website:8080 over edge-shared, from the edge's services/nuved.io.edge and
# services/www.nuved.io.edge (plans-backend deploy/hetzner/edge). The same container settings
# the cluster's pod had: uid 101, read-only root, /tmp the one writable path, no capabilities.
# compose.yml, not .yaml: scripts/validate.sh reads every *.yaml under apps/ as a Kubernetes manifest.
name: nuved-website

services:
  nuved-website:
    # The multi-arch index of nginxinc/nginx-unprivileged:1.31.1-alpine, by digest (Docker Hub,
    # 2026-10-07): the line the box's own nginx runs. Keeps its pid and every *_temp_path in /tmp.
    image: nginxinc/nginx-unprivileged:1.31.1-alpine@sha256:cc300bd2e8776708a8c2c8686a74f06eadf221c5ce01e85d0e821955d7a730ab
    container_name: nuved-website
    restart: unless-stopped
    user: "101:101"
    volumes:
      - type: bind
        source: ./site/html
        target: /usr/share/nginx/html
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./site/brand
        target: /usr/share/nginx/brand
        read_only: true
        bind: { create_host_path: false }
      # Replaces the image's default.conf entirely, as the www-nginx ConfigMap did.
      - type: bind
        source: ./site/conf.d
        target: /etc/nginx/conf.d
        read_only: true
        bind: { create_host_path: false }
    networks:
      edge-shared:
        aliases: [nuved-website]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  edge-shared:
    external: true
