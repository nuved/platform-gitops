# "www" — the nuved.io landing page, deployed by Argo CD from this repo into the
# nuved-www workspace. The platform serves its own public page as an ordinary
# tenant workload: same AppProject boundary, same Kyverno rules, same Gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: www
  labels:
    app: www
spec:
  replicas: 1
  selector:
    matchLabels:
      app: www
  template:
    metadata:
      labels:
        app: www
    spec:
      # PSS restricted, set at pod level so the tenancy-restricted Kyverno policy's
      # pod-level anyPattern matches: non-root and seccomp here, the per-container
      # rules below.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101      # the "nginx" user baked into nginx-unprivileged
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Verified against digest
          # sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
          # (2026-09-14): listens on 8080 as uid 101, keeps its pid and every temp
          # path under /tmp, and every docker-entrypoint.d script exits cleanly on a
          # read-only root. The tag is left floating so patch releases still land.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Comfortably inside the workspace LimitRange defaults
          # (requests 100m/128Mi, limits 500m/256Mi) — a one-file static site.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              # nginx.conf puts the pid file and all *_temp_path dirs here, so this
              # is the only writable path a read-only root filesystem needs.
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: html
          configMap:
            name: www-html
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: www
  labels:
    app: www
spec:
  selector:
    app: www
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The page is reachable only through the platform's shared Gateway; the workspace
# NetworkPolicy drops every other route in. Same parentRef as apps/api.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www
  labels:
    app: www
spec:
  parentRefs:
    - name: nuved
      namespace: platform-ingress
  hostnames:
    - "nuved.io"
    - "www.nuved.io"
  rules:
    - backendRefs:
        - name: www
          port: 80
