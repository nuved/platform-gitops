# GENERATED by ./render.sh from the .html and .woff2 files in this directory — do not
# edit by hand.
# Every key here becomes a file in /usr/share/nginx/html, because the Deployment mounts
# the whole ConfigMap as that directory. So index.html is served at / and
# how-it-works.html at /how-it-works.html with no nginx configuration of our own, and
# the pages reach the fonts by their bare filenames.
# nginx reads the file per request, so a ConfigMap change reaches visitors without a
# restart (the kubelet refreshes a mounted ConfigMap within about a minute).
apiVersion: v1
kind: ConfigMap
metadata:
  name: www-html
  labels:
    app: www
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuved — a place your AI agent can deploy to</title>
    <meta name="description" content="Give your coding agent a project with caps you set and a prepaid balance it cannot exceed. Stock kubectl, a public URL per service, and an hourly rate for what a service reserves.">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B5563'/%3E%3Cpath d='M9 23V9l14 14V9' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
    <style>
    /* Typefaces are served from this origin, not from a font CDN: no third-party
       request is made when someone opens this page. Schibsted Grotesk (Ellmer Type)
       and IBM Plex Mono (IBM) are both SIL Open Font License 1.1 — see README.md.
       Schibsted Grotesk is a variable font, so one file covers 400 through 700. */
    @font-face{
      font-family:"Schibsted Grotesk";
      src:url(schibsted-grotesk.woff2) format("woff2");
      font-weight:400 700; font-style:normal; font-display:swap;
    }
    @font-face{
      font-family:"IBM Plex Mono";
      src:url(ibm-plex-mono-400.woff2) format("woff2");
      font-weight:400; font-style:normal; font-display:swap;
    }
    @font-face{
      font-family:"IBM Plex Mono";
      src:url(ibm-plex-mono-500.woff2) format("woff2");
      font-weight:500; font-style:normal; font-display:swap;
    }
    
    /* Dark is the default, so the page matches the console and the API docs. A
       visitor whose system asks for light gets the light palette below. Every pair
       used for text clears 4.5:1 in both. */
    :root{
      --ground:#0B1516; --surface:#122022; --sunken:#0A1213;
      --ink:#E3ECEB; --ink-2:#9DB1B3; --line:#26393C; --line-strong:#48616A;
      --brand:#63C3D2; --brand-soft:#123A42; --on-brand:#06171A;
      --ok:#7FD3A3; --ok-bg:#14301F;
      --no:#F0A090; --no-bg:#3A1C17;
      --term-bg:#07100F; --term-ink:#D8E6E6; --term-dim:#94ABAE; --term-ok:#7FD3A3; --term-no:#F0A090; --term-prompt:#63C3D2;
      --meter:#63C3D2;
      --focus:#63C3D2;
    }
    @media (prefers-color-scheme: light){
      :root{
        --ground:#F2F5F5; --surface:#FFFFFF; --sunken:#E6ECEC;
        --ink:#12262A; --ink-2:#4C6165; --line:#CBD7D7; --line-strong:#98ACAE;
        --brand:#0B5563; --brand-soft:#DCEBEC; --on-brand:#FFFFFF;
        --ok:#2C6E48; --ok-bg:#E1F0E6;
        --no:#A63A2C; --no-bg:#F7E4E0;
        --term-bg:#0E1C1F; --term-ink:#D8E6E6; --term-dim:#94ABAE;
        --meter:#0B5563;
        --focus:#0B5563;
      }
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0; background:var(--ground); color:var(--ink);
      font-family:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      font-size:17px; line-height:1.55;
    }
    a{color:var(--brand)}
    a:focus-visible,button:focus-visible{outline:3px solid var(--focus); outline-offset:3px; border-radius:3px}
    .wrap{max-width:1120px; margin:0 auto; padding-left:24px; padding-right:24px}
    h1,h2,h3{line-height:1.1; letter-spacing:-0.02em; margin:0; text-wrap:balance}
    h1{font-size:54px; font-weight:700}
    h2{font-size:32px; font-weight:700}
    h3{font-size:20px; font-weight:700; letter-spacing:-0.01em}
    p{margin:0}
    .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .num{font-variant-numeric:tabular-nums}
    
    /* top bar */
    .top{border-bottom:1px solid var(--line); background:var(--surface)}
    .top .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:8px 24px; padding-block:12px}
    .mark{font-size:22px; font-weight:700; letter-spacing:-0.03em; color:var(--ink); text-decoration:none; padding:12px 0}
    .mark span{color:var(--brand)}
    .top nav{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; margin-left:auto}
    .top nav a{font-size:16px; color:var(--ink-2); text-decoration:none; padding:12px 10px; display:inline-block; border-radius:6px}
    .top nav a:hover{color:var(--brand); background:var(--brand-soft)}
    .top nav a.go{color:var(--on-brand); background:var(--brand); font-weight:500; padding:12px 16px}
    .top nav a.go:hover{background:var(--ink); color:var(--ground)}
    
    /* hero */
    .hero{padding-top:80px; display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:32px 48px; align-items:end}
    .hero h1{max-width:14ch}
    .hero .sub{font-size:21px; color:var(--ink-2); max-width:38ch; line-height:1.45}
    .hero .cta{display:flex; flex-wrap:wrap; gap:12px; margin-top:28px}
    .hero .invite{margin-top:16px; font-size:16px; color:var(--ink-2); max-width:40ch}
    .btn{
      display:inline-flex; align-items:center; justify-content:center; text-align:center;
      min-height:48px; padding:10px 24px; border-radius:6px; font-size:17px; font-weight:500;
      text-decoration:none; border:2px solid var(--brand); cursor:pointer; font-family:inherit;
    }
    .btn-primary{background:var(--brand); color:var(--on-brand)}
    .btn-primary:hover{background:var(--ink); border-color:var(--ink); color:var(--ground)}
    .btn-secondary{background:transparent; color:var(--brand)}
    .btn-secondary:hover{background:var(--brand-soft)}
    
    /* the thesis: one deploy, two views */
    .two{margin-top:56px}
    .two .lead{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 24px; margin-bottom:16px}
    .two .lead p{color:var(--ink-2); font-size:16px}
    .views{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0; border:1px solid var(--line-strong); border-radius:10px; overflow:hidden}
    .view-label{font-size:14px; font-weight:500; letter-spacing:.01em; padding:10px 18px; border-bottom:1px solid var(--line)}
    .term{background:var(--term-bg); color:var(--term-ink)}
    .term .view-label{color:var(--term-dim); border-bottom-color:#1F3236}
    .term pre{margin:0; padding:18px 18px 22px; font-size:13.5px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere}
    .term .p{color:var(--term-prompt)}
    .term .ok{color:var(--term-ok)}
    .term .no{color:var(--term-no)}
    .term .dim{color:var(--term-dim)}
    .term .gap{display:block; height:12px}
    .con{background:var(--surface); display:flex; flex-direction:column}
    .con .view-label{color:var(--ink-2)}
    .con .body{padding:18px; display:flex; flex-direction:column; gap:16px; flex:1}
    .bal{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px}
    .bal .amt{font-size:30px; font-weight:700; letter-spacing:-0.02em}
    .bal .rate{font-size:15px; color:var(--ink-2)}
    .proj{border:1px solid var(--line); border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
    .proj .head{display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; align-items:baseline}
    .proj .head b{font-size:17px}
    .proj .caps{font-size:14px; color:var(--ink-2)}
    .meter{height:8px; background:var(--sunken); border-radius:4px; overflow:hidden}
    .meter i{display:block; height:100%; width:50%; background:var(--meter); border-radius:4px}
    .meter-cap{display:flex; justify-content:space-between; font-size:14px; color:var(--ink-2)}
    .svc{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; font-size:15px}
    .svc .url{color:var(--brand); font-size:14px; overflow-wrap:anywhere}
    .pill{font-size:13px; font-weight:500; padding:2px 10px; border-radius:999px; background:var(--ok-bg); color:var(--ok)}
    .pill.no{background:var(--no-bg); color:var(--no)}
    .toks{border-top:1px solid var(--line); padding-top:14px}
    .toks h4{margin:0 0 8px; font-size:15px; font-weight:500; color:var(--ink-2); letter-spacing:0}
    .toks .row{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 12px; font-size:15px}
    .toks .row span:last-child{font-size:14px; color:var(--ink-2)}
    .con .acts{display:flex; flex-wrap:wrap; gap:10px; margin-top:auto; padding-top:6px}
    .btn-sm{min-height:48px; padding:8px 16px; font-size:15px}
    .btn-quiet{border-color:var(--line-strong); color:var(--ink); background:var(--surface)}
    .btn-quiet:hover{background:var(--sunken)}
    
    /* sections */
    section{padding-top:96px}
    .sec-head{max-width:60ch; margin-bottom:36px; display:flex; flex-direction:column; gap:12px}
    .sec-head p{color:var(--ink-2); font-size:18px}
    
    /* can / can't ledger */
    .ledger{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0; border-top:2px solid var(--ink)}
    .ledger > div{padding:24px 0}
    .ledger > div + div{border-left:1px solid var(--line); padding-left:40px}
    .ledger h3{margin-bottom:16px}
    .ledger ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px}
    .ledger li{display:grid; grid-template-columns:24px 1fr; gap:12px; align-items:start; font-size:17px; line-height:1.45}
    .ledger li svg{width:22px; height:22px; margin-top:2px}
    .ledger .can li svg{color:var(--ok)}
    .ledger .cant li svg{color:var(--no)}
    .ledger li small{display:block; color:var(--ink-2); font-size:15px; margin-top:2px}
    .enforced{margin-top:28px; padding:16px 20px; background:var(--brand-soft); color:var(--ink); border-radius:8px; font-size:16px; max-width:70ch}
    .notyet{margin-top:16px; padding:16px 20px; border:1px solid var(--line-strong); border-left:4px solid var(--no); border-radius:8px; font-size:16px; max-width:70ch; color:var(--ink)}
    .notyet b{color:var(--no)}
    
    /* how it starts */
    .steps{counter-reset:s; list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:32px}
    .steps li{counter-increment:s; display:flex; flex-direction:column; gap:10px; padding-top:16px; border-top:2px solid var(--ink)}
    .steps li::before{content:counter(s); font-family:"IBM Plex Mono",monospace; font-size:15px; color:var(--brand); font-weight:500}
    .steps h3{margin:0}
    .steps p{color:var(--ink-2); font-size:16px}
    .snippet{margin:8px 0 0; padding:14px 16px; background:var(--term-bg); color:var(--term-ink); border-radius:8px; font-size:13px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere}
    .snippet .dim{color:var(--term-dim)}
    
    /* pricing */
    .price-head{display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px}
    .badge{font-size:14px; font-weight:500; color:var(--ink); background:var(--brand-soft); border:1px solid var(--brand); padding:6px 12px; border-radius:999px}
    .pricing{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:40px 64px; align-items:start}
    .rates{width:100%; border-collapse:collapse; font-size:17px}
    .rates th,.rates td{text-align:left; padding:14px 0; border-bottom:1px solid var(--line); vertical-align:baseline}
    .rates th{font-weight:500; color:var(--ink-2); width:38%}
    .rates td{font-weight:700; font-size:20px; letter-spacing:-0.01em}
    .rates td small{font-weight:400; font-size:15px; color:var(--ink-2); margin-left:6px}
    .rates tr:first-child th,.rates tr:first-child td{border-top:2px solid var(--ink)}
    .topups{margin-top:24px; font-size:16px; color:var(--ink-2)}
    .topups b{color:var(--ink); font-weight:500}
    .examples{list-style:none; margin:0; padding:0; border-top:2px solid var(--ink)}
    .examples li{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 24px; padding:16px 0; border-bottom:1px solid var(--line); align-items:baseline}
    .examples b{font-size:18px; font-weight:700; display:block}
    .examples .spec{font-size:15px; color:var(--ink-2)}
    .examples .cost{font-size:22px; font-weight:700; letter-spacing:-0.01em; white-space:nowrap}
    .examples .cost small{font-size:15px; font-weight:400; color:var(--ink-2); margin-left:4px}
    .zero{margin-top:20px; font-size:16px; color:var(--ink-2); max-width:52ch}
    .price-cta{margin-top:40px}
    
    /* faq */
    .faq{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:36px 56px}
    .faq h3{margin-bottom:8px; font-size:19px}
    .faq p{color:var(--ink-2); font-size:16px; max-width:46ch}
    .faq code{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-size:14px; color:var(--ink)}
    
    footer{margin-top:96px; border-top:1px solid var(--line); background:var(--surface); padding:32px 0 48px}
    footer .wrap{display:flex; flex-wrap:wrap; gap:8px 32px; align-items:baseline}
    footer a{font-size:16px; padding:12px 0; display:inline-block}
    footer p{font-size:15px; color:var(--ink-2); margin-left:auto; padding:12px 0}
    
    @media (max-width:900px){
      .hero{grid-template-columns:1fr; align-items:start}
      .views{grid-template-columns:1fr}
      .con{border-top:1px solid var(--line-strong)}
      .pricing{grid-template-columns:1fr}
      .steps{grid-template-columns:1fr}
      .ledger{grid-template-columns:1fr}
      .ledger > div + div{border-left:0; padding-left:0; border-top:1px solid var(--line)}
    }
    @media (max-width:640px){
      body{font-size:16px}
      h1{font-size:38px}
      h2{font-size:28px}
      .wrap{padding-left:16px; padding-right:16px}
      .hero{padding-top:48px}
      .hero .sub{font-size:19px}
      .hero .cta{flex-direction:column; align-items:stretch}
      .btn{width:100%}
      .con .acts .btn{width:auto; flex:1}
      .two{margin-top:40px}
      section{padding-top:64px}
      .term pre{font-size:12.5px; padding:16px 14px 20px}
      footer{margin-top:64px}
      footer p{margin-left:0}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
    </style>
    </head>
    <body>
    
    <header class="top">
      <div class="wrap">
        <a class="mark" href="/">nuved<span>.</span></a>
        <nav aria-label="Sections">
          <a href="#pricing">Pricing</a>
          <a href="#how">How it starts</a>
          <a href="https://api.nuved.io/docs">API docs</a>
          <a href="https://console.nuved.io/login">Sign in</a>
          <a class="go" href="https://console.nuved.io/signup">Create account</a>
        </nav>
      </div>
    </header>
    
    <main>
      <div class="wrap">
        <div class="hero">
          <div>
            <h1>A place your AI agent can deploy to.</h1>
          </div>
          <div>
            <p class="sub">Give Claude Code, Codex or Cursor a project with limits you set and a balance it can't exceed. The agent ships. You stay in charge.</p>
            <div class="cta">
              <a class="btn btn-primary" href="https://console.nuved.io/signup">Create account</a>
              <a class="btn btn-secondary" href="#pricing">See the rates</a>
            </div>
            <p class="invite">The preview is invitation-only. <a href="mailto:hello@nuved.io?subject=Invitation%20to%20the%20Nuved%20preview">Request an invitation</a>, or <a href="https://console.nuved.io/login">sign in</a> if you have one.</p>
          </div>
        </div>
    
        <div class="two">
          <div class="lead">
            <h2>One deploy, two views.</h2>
            <p>What the agent sees, and what you see. Same minute.</p>
          </div>
          <div class="views">
            <div class="term">
              <div class="view-label">Your terminal, then your agent's</div>
    <pre class="mono"><span class="p">$</span> nuved project create shop --cpu 0.5 --mem 1Gi --services 3
    Created project shop (0.5 vCPU · 1 GiB · 3 services)
    <span class="p">$</span> nuved token create shop --for claude-code
    <span class="p">$</span> nuved kubeconfig shop -o ~/.kube/shop-agent
    <span class="ok">Wrote ~/.kube/shop-agent</span>
    <span class="gap"></span><span class="dim"># from here on the agent, holding that file and nothing else</span>
    <span class="p">$</span> kubectl apply -f k8s/api.yaml
    deployment.apps/api created
    service/api created
    <span class="gap"></span><span class="p">$</span> kubectl get ns
    NAME        STATUS
    acme-shop   Active
    <span class="gap"></span><span class="p">$</span> kubectl -n acme-billing get pods
    <span class="no">Error from server (Forbidden):</span> this token was made
    for the project acme-shop
    <span class="gap"></span><span class="p">$</span> kubectl apply -f k8s/big.yaml <span class="dim"># asks for 2 vCPU</span>
    deployment.apps/big created
    <span class="p">$</span> kubectl describe deploy big | grep forbidden
    <span class="no">pods "big-7c9f4" is forbidden: exceeded quota:</span>
    <span class="no">workspace-quota, requested: requests.cpu=2,</span>
    <span class="no">limited: requests.cpu=500m</span></pre>
            </div>
            <div class="con">
              <div class="view-label">Your console</div>
              <div class="body">
                <div class="bal">
                  <span class="amt num">€24.31</span>
                  <span class="rate">balance · €0.015 an hour · about 67 days left</span>
                </div>
                <div class="proj">
                  <div class="head">
                    <b>acme-shop</b>
                    <span class="caps num">0.5 vCPU · 1 GiB · up to 3 services</span>
                  </div>
                  <div class="meter" role="img" aria-label="0.25 of 0.5 vCPU reserved"><i></i></div>
                  <div class="meter-cap num"><span>0.25 vCPU reserved</span><span>512 MiB of 1 GiB</span></div>
                  <div class="svc"><span class="mono">api</span><span class="pill">Healthy</span><span class="num">1/1 ready · €0.015 an hour</span></div>
                  <div class="svc"><span class="url mono">https://api-acme-shop.nuved.io</span></div>
                </div>
                <div class="toks">
                  <h4>Tokens — each one reaches a single project</h4>
                  <div class="row"><span class="mono">claude-code</span><span class="num">acme-shop · last used 14:07</span></div>
                </div>
                <div class="acts">
                  <a class="btn btn-sm btn-quiet" href="https://console.nuved.io/login">Top up €10</a>
                  <a class="btn btn-sm btn-quiet" href="https://console.nuved.io/login">Download kubeconfig</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    
      <section class="wrap" id="rules">
        <div class="sec-head">
          <h2>What your agent can and can't do.</h2>
          <p>The agent gets a token for one project. Everything below is enforced by the cluster itself, so none of it depends on the agent behaving.</p>
        </div>
        <div class="ledger">
          <div class="can">
            <h3>It can</h3>
            <ul>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Deploy with the kubectl it already knows<small>You hand it a kubeconfig for one project. There is no agent-only tool to learn.</small></span></li>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Read logs, restart and scale, inside the caps</span></li>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Put a service on a public address<small>Every service gets one at <span class="mono">&lt;service&gt;-&lt;project&gt;.nuved.io</span>. During the preview we open the route for you.</small></span></li>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Delete and redeploy what it made, in its own project</span></li>
            </ul>
          </div>
          <div class="cant">
            <h3>It can't</h3>
            <ul>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Spend past your balance<small>Only you can top up. There is no card on file for the agent to reach.</small></span></li>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Go over the caps you set<small>The quota refuses it before anything starts, so it never runs and it is never billed.</small></span></li>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Reach another project, or the machines<small>Both answer Forbidden at the door, before the request reaches Kubernetes.</small></span></li>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Change the caps, the tokens or your account</span></li>
            </ul>
          </div>
        </div>
        <p class="enforced">Each project is its own walled-off space: its own network, its own quota, its own rules about what a container may do. Two projects on the same account can't reach each other.</p>
        <p class="notyet"><b>Not built yet, so you should know:</b> there is no trash and no nightly snapshot, which means a delete inside a project is final today. Give an agent a project you could afford to lose. Both are next, along with building an image straight from a folder.</p>
      </section>
    
      <section class="wrap" id="how">
        <div class="sec-head">
          <h2>How it starts.</h2>
          <p>Three steps, about five minutes. The agent does the rest.</p>
        </div>
        <ol class="steps">
          <li>
            <h3>Get in</h3>
            <p>The preview is invitation-only while it runs on one machine. Ask for an invitation, then sign in with your own account — the same one, every time, no shared password.</p>
          </li>
          <li>
            <h3>Top up</h3>
            <p>€10 or more by card. That balance is the most this account can ever spend. When it reaches zero every service pauses and nothing is deleted.</p>
          </li>
          <li>
            <h3>Hand your agent the keys</h3>
            <p>Make a project, set the most vCPU, memory and services it may use, and create a token for that one project. Download its kubeconfig and point the agent at it.</p>
    <pre class="snippet mono"><span class="dim"># AGENTS.md</span>
    Deploy with: KUBECONFIG=~/.kube/shop-agent kubectl apply -f k8s/
    Project shop is capped at 0.5 vCPU and 1 GiB. Set small,
    explicit requests — anything larger the server refuses.</pre>
          </li>
        </ol>
      </section>
    
      <section class="wrap" id="pricing">
        <div class="sec-head">
          <div class="price-head">
            <h2>Pricing.</h2>
            <span class="badge">Preview: payments run in Stripe test mode, nothing is charged</span>
          </div>
          <p>No plans. Each hour, a service costs what it reserves, paid from a balance you loaded in advance. The console shows the rate per hour next to every service.</p>
        </div>
        <div class="pricing">
          <div>
            <table class="rates">
              <tr><th scope="row">Compute</th><td class="num">€0.04<small>per vCPU-hour</small></td></tr>
              <tr><th scope="row">Memory</th><td class="num">€0.01<small>per GiB-hour</small></td></tr>
              <tr><th scope="row">Disk</th><td class="num">€0.20<small>per GB a month</small></td></tr>
            </table>
            <p class="topups">Top up <b>€10</b>, <b>€25</b>, <b>€50</b> or <b>€100</b>. Balance never expires.</p>
            <p class="zero">At zero, services pause and nothing is deleted. Top up and they come back with the replicas they had.</p>
          </div>
          <div>
            <ul class="examples" aria-label="What things cost">
              <li><span><b>A tiny service</b><span class="spec num">0.1 vCPU, 128 MiB</span></span><span class="cost num">€4<small>a month</small></span></li>
              <li><span><b>A small API</b><span class="spec num">0.25 vCPU, 512 MiB</span></span><span class="cost num">€11<small>a month</small></span></li>
              <li><span><b>An app, a worker and Postgres</b><span class="spec num">1 vCPU, 2 GiB, 10 GB of disk</span></span><span class="cost num">€46<small>a month</small></span></li>
            </ul>
            <p class="zero">Rates come from what the machines cost us plus a margin, and they fall when the machines get cheaper. You pay for what a service reserves, which is the number the console shows you.</p>
          </div>
        </div>
        <div class="price-cta">
          <a class="btn btn-primary" href="https://console.nuved.io/signup">Create account</a>
        </div>
      </section>
    
      <section class="wrap" id="faq">
        <div class="sec-head">
          <h2>Questions.</h2>
        </div>
        <div class="faq">
          <div>
            <h3>What is a project?</h3>
            <p>A walled-off space for one app: its services, its caps, its agent token and its own network. Other projects can't reach it, and it can't reach them.</p>
          </div>
          <div>
            <h3>Which agents work?</h3>
            <p>Any agent that can run a shell command — Claude Code, Codex, Cursor, Aider. They use stock kubectl with the kubeconfig you give them, so there is nothing new for the agent to learn. It works from your own terminal too.</p>
          </div>
          <div>
            <h3>Do I need your CLI?</h3>
            <p>Only you do. <code>nuved</code> signs you in and manages projects, tokens and your balance; your agent needs nothing but kubectl. CLI downloads are coming this week — until then the console does all of it in the browser.</p>
          </div>
          <div>
            <h3>Where does my code live?</h3>
            <p>Wherever it lives now, GitHub or your laptop. You bring a container image and the agent applies it into your project. Building the image here, straight from a folder, is the next thing we ship.</p>
          </div>
          <div>
            <h3>What happens when the balance hits zero?</h3>
            <p>Every service pauses and nothing is deleted. Top up and they come back with the replicas they had.</p>
          </div>
          <div>
            <h3>Can the agent delete my data?</h3>
            <p>Inside its own project, yes — and today that is final, because the trash and the nightly snapshot aren't built yet. It cannot reach another project, your caps or your balance.</p>
          </div>
          <div>
            <h3>Is this real?</h3>
            <p>A preview on one machine, run by one engineer, open by invitation. Payments go through Stripe's test mode, so nothing is charged. The caps and the isolation are real: they are the cluster's own quotas and network rules, not a check in our code.</p>
          </div>
        </div>
      </section>
    </main>
    
    <footer>
      <div class="wrap">
        <a href="how-it-works.html">How it works</a>
        <a href="https://api.nuved.io/docs">API docs</a>
        <a href="https://github.com/nuved/platform-gitops">Source on GitHub</a>
        <a href="mailto:hello@nuved.io?subject=Invitation%20to%20the%20Nuved%20preview">Request an invitation</a>
        <p>Preview, built and operated by one engineer.</p>
      </div>
    </footer>
    
