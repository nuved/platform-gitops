    <body>
    
    <header class="top">
      <div class="wrap">
        <a class="mark" href="/">nuved<span>.</span></a>
        <nav aria-label="Sections">
          <a href="/#pricing">Pricing</a>
          <a href="https://api.nuved.io/docs">API docs</a>
          <a href="https://console.nuved.io/login">Sign in</a>
          <a class="go" href="https://console.nuved.io/signup">Create account</a>
        </nav>
      </div>
    </header>
    
    <main>
      <div class="wrap">
        <div class="lead">
          <a class="back" href="/">Back to the homepage</a>
          <h1>How it works</h1>
          <p>The homepage says what you get. This page says what actually runs, because the part worth judging is what the platform refuses to do.</p>
        </div>
    
        <section id="steps">
          <h2>Four steps</h2>
          <p class="kicker">A different piece of the platform owns each one, and each one leaves something behind you can check.</p>
          <ol class="rail">
            <li>
              <h3><span class="step-n">1</span>Sign in as yourself</h3>
              <p>Identity lives in <span class="by">Authentik</span>, not here. The console sends you there for the ordinary browser sign-in; the <code>nuved</code> CLI uses the device flow, where you approve a nine-digit code in a browser. No password ever reaches Nuved, and there is no shared demo login.</p>
              <p>Sign-up is open by invitation only: the enrolment flow is gated behind an invitation stage, so an address nobody invited never reaches the form.</p>
            </li>
            <li>
              <h3><span class="step-n">2</span>Top up, and a tenant appears</h3>
              <p>Stripe Checkout takes the payment, in test mode. The signed webhook is what does the work: <span class="by">plans-backend</span> writes the credit to Postgres, which is the source of truth for every cent, and creates a <code>Tenant</code> in the cluster carrying your caps.</p>
              <p>The webhook is idempotent on Stripe's event id, and a delivery whose credit or provisioning fails is answered 500 so Stripe retries it rather than losing the money.</p>
            </li>
            <li>
              <h3><span class="step-n">3</span>A project becomes a namespace</h3>
              <p>The <span class="by">tenancy-operator</span> turns each project into a namespace with a ResourceQuota built from the caps you set, a LimitRange so a container that declares no requests still gets some, a default-deny NetworkPolicy, and a RoleBinding to the built-in <code>edit</code> role scoped to that one namespace.</p>
              <p>Change the caps and the quota changes under the running services. Nothing over the quota is admitted, so nothing over it is ever billed.</p>
            </li>
            <li>
              <h3><span class="step-n">4</span>A token reaches one project</h3>
              <p>The kubeconfig you download points at <span class="by">kube.nuved.io</span>, the platform's own API proxy, never at the Kubernetes API. The proxy checks the token, works out which project it belongs to, and refuses every request outside it before Kubernetes sees it.</p>
              <p>That is why <code>kubectl get ns</code> with an agent token lists exactly one namespace, and why reading another project's pods comes back <code>Forbidden</code> with a sentence instead of a stack trace.</p>
            </li>
          </ol>
        </section>
    
        <section id="paths">
          <h2>What reaches what</h2>
          <p class="kicker">Four paths, each with exactly one door. Nothing gets to a namespace except through one of these.</p>
          <div class="flow">
            <figure class="lane">
              <h3>Signing in</h3>
              <ul class="chain">
                <li><span class="node you">you</span><span class="hop">&rarr;</span></li>
                <li><span class="node">Authentik</span><span class="hop">&rarr;</span></li>
                <li><span class="node">console.nuved.io</span><span class="hop">&rarr;</span></li>
                <li><span class="node">your account</span></li>
              </ul>
              <figcaption>An OpenID Connect round trip. The console holds a session cookie afterwards; the CLI holds a token it got from the device flow. Nuved never sees a password.</figcaption>
            </figure>
            <figure class="lane">
              <h3>Paying</h3>
              <ul class="chain">
                <li><span class="node you">you</span><span class="hop">&rarr;</span></li>
                <li><span class="node">Stripe Checkout</span><span class="hop">&rarr;</span></li>
                <li><span class="node">signed webhook</span><span class="hop">&rarr;</span></li>
                <li><span class="node">plans-backend</span><span class="hop">&rarr;</span></li>
                <li><span class="node">Postgres ledger</span><span class="hop">&rarr;</span></li>
                <li><span class="node">Tenant</span><span class="hop">&rarr;</span></li>
                <li><span class="node wall">namespace</span></li>
              </ul>
              <figcaption>The balance moves in Postgres first and the cluster follows. Every ten minutes the meter reads each project's quota, prices it from the rate card, and debits the ledger. At zero it scales each deployment to zero and writes down the replica count, so a top-up puts back exactly what was running.</figcaption>
            </figure>
            <figure class="lane">
              <h3>Deploying</h3>
              <ul class="chain">
                <li><span class="node you">your agent</span><span class="hop">&rarr;</span></li>
                <li><span class="node">kubectl</span><span class="hop">&rarr;</span></li>
                <li><span class="node">kube.nuved.io</span><span class="hop">&rarr;</span></li>
                <li><span class="node">Kubernetes API</span><span class="hop">&rarr;</span></li>
                <li><span class="node wall">its namespace</span></li>
              </ul>
              <figcaption>The proxy is the boundary. Another project, or the machines, stop here: <span class="node stop">Forbidden</span> comes from the proxy, not from a rule inside the cluster that a clever request might get past.</figcaption>
            </figure>
            <figure class="lane">
              <h3>Visitors</h3>
              <ul class="chain">
                <li><span class="node you">a visitor</span><span class="hop">&rarr;</span></li>
                <li><span class="node">Cloudflare</span><span class="hop">&rarr;</span></li>
                <li><span class="node">the node</span><span class="hop">&rarr;</span></li>
                <li><span class="node">Gateway</span><span class="hop">&rarr;</span></li>
                <li><span class="node wall">your Service</span></li>
              </ul>
              <figcaption>One shared Gateway, no cloud load balancer. Cloudflare proxies <code>*.nuved.io</code> to the node's fixed address, and the Gateway routes by hostname, which is how a service ends up at <code>&lt;service&gt;-&lt;project&gt;.nuved.io</code>. A hostname nobody claimed gets a 404 from the Gateway. The default-deny NetworkPolicy drops every other way in.</figcaption>
            </figure>
          </div>
          <p class="kicker" style="margin-top:8px">This page is one of those Services. It is deployed from <code>apps/www</code> in the public manifests repo by Argo CD, into a namespace with the same quota, the same policies and the same Gateway as a customer's — no exception for being ours.</p>
        </section>
    
        <section id="enforced">
          <h2>What the platform enforces</h2>
          <p class="kicker">Every line here is a rule the cluster applies on its own, not advice in a runbook. The tag says which component refuses you when you break it.</p>
          <ul class="enforced">
            <li><span>One namespace per project, labelled with its tenant and project</span><span class="where">tenancy-operator</span></li>
            <li><span>A ResourceQuota per project built from your caps, and a LimitRange so a container that declares no requests still gets some</span><span class="where">tenancy-operator</span></li>
            <li><span>A default-deny NetworkPolicy: pods talk to their own namespace and to DNS, nothing else</span><span class="where">tenancy-operator</span></li>
            <li><span>A RoleBinding to the built-in <code>edit</code> role, scoped to the one namespace</span><span class="where">tenancy-operator</span></li>
            <li><span>The operator will not adopt a namespace it did not create, so deleting a project can never take someone else's with it</span><span class="where">tenancy-operator</span></li>
            <li><span>An agent token reaches exactly one project; every other namespace, and the machines, answer Forbidden</span><span class="where">kube.nuved.io</span></li>
            <li><span>The Kubernetes API is never published: every customer request arrives through the proxy</span><span class="where">kube.nuved.io</span></li>
            <li><span>No privileged containers, no host network, host PID or host IPC</span><span class="where">Kyverno admission</span></li>
            <li><span>Non-root only, no privilege escalation, all capabilities dropped, seccomp on, no hostPath, no hostPort</span><span class="where">Kyverno admission</span></li>
            <li><span>No PodDisruptionBudget that blocks every eviction and would stall a node drain</span><span class="where">Kyverno admission</span></li>
            <li><span>An Argo AppProject per platform workspace, locked to that namespace, this repo, and five resource kinds</span><span class="where">Argo CD</span></li>
            <li><span>kubeconform plus those same Kyverno policies on every pull request, so the answer arrives before the merge</span><span class="where">CI gate</span></li>
            <li><span>Your balance is the ceiling: at zero the meter pauses every service and a top-up restores the replica counts it wrote down</span><span class="where">plans-backend</span></li>
            <li><span>No static AWS keys anywhere in the cluster: service accounts assume roles through the cluster's own OIDC issuer</span><span class="where">IRSA</span></li>
          </ul>
        </section>
    
        <section id="honest">
          <h2>What this is, honestly</h2>
          <div class="note warn">
            <h3>One machine, one engineer, invitation only</h3>
            <ul>
              <li><b>One node.</b> The whole platform, this page included, runs on a single small AWS machine managed by kops. There is no high availability: when that node restarts, everything on it goes down with it.</li>
              <li><b>Stripe is in test mode.</b> Nothing is charged. Balances, the ledger and the hourly meter are real code doing real arithmetic against a test-mode payment.</li>
              <li><b>No undo yet.</b> There is no trash and no nightly snapshot, so deleting something inside a project is final. Give an agent a project you could afford to lose.</li>
              <li><b>No build service.</b> You bring a container image. Building one from a folder is the next thing being built, not something that works today.</li>
            </ul>
          </div>
          <div class="cta">
            <a class="btn" href="https://console.nuved.io/signup">Create account</a>
          </div>
        </section>
      </div>
    </main>
    
